[project]
name = "doxify"
version = "0.1.0"
license = "MIT"
description = "Compile evidence-backed READMEs and portfolio case studies from local git repositories"
readme = "README.md"
authors = [
    { name = "Ekomjah Edet", email = "ekomjahedet@gmail.com" }
]
keywords = ["cli", "documentation", "gemma", "git", "ollama", "readme"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
requires-python = ">=3.10"
dependencies = [
    "gitpython>=3.2.1",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "sentry-sdk>=2.73.0",
    "tomli>=2.5.0",
    "typer>=0.27.3",
]

[project.scripts]
doxify = "doxify:main"

[project.urls]
Homepage = "https://github.com/Ekomjah/doxify"
Repository = "https://github.com/Ekomjah/doxify"
Issues = "https://github.com/Ekomjah/doxify/issues"
Changelog = "https://github.com/Ekomjah/doxify/releases"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]
