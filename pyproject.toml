[project]
name = "doxify"
version = "0.1.0"
description = "Compile evidence-backed READMEs and portfolio case studies from local git repositories"
readme = "README.md"
authors = [
    { name = "Ekomjah Edet", email = "ekomjahedet@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "gitpython>=3.2.1",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "tomli>=2.5.0",
    "typer>=0.27.3",
]

[project.scripts]
doxify = "doxify:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]
