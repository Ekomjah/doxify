name: Sentry nightly health check

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-check:
    name: Doxify self-check and cron check-in
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: production
      SENTRY_TRACES_SAMPLE_RATE: "1.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run self-check
        run: uv run doxify self-check --json --monitor-slug doxify-nightly
