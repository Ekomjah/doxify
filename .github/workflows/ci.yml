name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Build package
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  installer:
    name: Installer smoke test
    runs-on: ubuntu-latest
    env:
      SENTRY_DSN: ""
      DOXIFY_SOURCE_DIR: ${{ github.workspace }}
      UV_TOOL_DIR: ${{ runner.temp }}/doxify-tool
      UV_TOOL_BIN_DIR: ${{ runner.temp }}/doxify-bin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Check shell syntax
        run: sh -n install.sh

      - name: Run installer from source checkout
        run: sh install.sh

      - name: Verify installed command
        run: |
          "$UV_TOOL_BIN_DIR/doxify" --version
          "$UV_TOOL_BIN_DIR/doxify" self-check --json

  verify:
    name: Verify evidence-backed claims
    runs-on: ubuntu-latest
    env:
      SENTRY_DSN: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify self-audit README
        uses: ./
        with:
          artifact: README.md
          evidence: docs/self-audit/evidence.json
          fail-on: needs_evidence,rejected

      - name: Verify unresolved case study (expected failure)
        id: negative
        continue-on-error: true
        uses: ./
        with:
          artifact: output/next-dashboard/case-study/case-study.md
          evidence: output/next-dashboard/case-study/evidence.json
          fail-on: needs_evidence,rejected

      - name: Assert unresolved case study fails
        if: steps.negative.outcome != 'failure'
        shell: bash
        run: |
          echo "::error::Expected the unresolved case study to fail verification."
          exit 1
